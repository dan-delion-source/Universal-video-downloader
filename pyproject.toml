[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "universal-video-downloader"
version = "0.1.0"
description = "A lightweight, local-first video downloader"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "yt-dlp>=2025.1", "httpx>=0.27,<1", "selectolax>=0.3,<1", "pydantic>=2,<3"]

[project.optional-dependencies]
browser = ["playwright>=1.49,<2"]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.package-data]
backend = ["browser_navigation.js"]
